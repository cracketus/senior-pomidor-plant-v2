name: Quality

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  edge-delivery-integration:
    name: Edge delivery integration
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Run edge delivery integration
        run: >-
          docker compose -f docker-compose.integration.yml up --build
          --abort-on-container-exit --exit-code-from integration-test

      - name: Show integration service logs
        if: failure()
        run: >-
          docker compose -f docker-compose.integration.yml logs --no-color
          edge mqtt-broker mock-core integration-test

      - name: Remove integration stack
        if: always()
        run: >-
          docker compose -f docker-compose.integration.yml down
          --volumes --remove-orphans

  edge-docker-smoke:
    name: Edge Docker smoke
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CONTAINER_NAME: senior-pomidor-edge-smoke
      IMAGE_TAG: senior-pomidor-edge:ci-${{ github.run_id }}-${{ github.run_attempt }}
      POLL_INTERVAL_SECONDS: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build edge image
        run: docker build --build-arg INSTALL_HARDWARE_DEPS=false --tag "$IMAGE_TAG" .

      - name: Start edge container
        run: |
          docker run --detach \
            --name "$CONTAINER_NAME" \
            --network none \
            --env DEVICE_ID=edge-docker-smoke \
            --env MOCK_SENSORS=true \
            --env POLL_INTERVAL_SECONDS="$POLL_INTERVAL_SECONDS" \
            --env MQTT_HOST=127.0.0.1 \
            --env MQTT_PORT=1 \
            --env MQTT_TOPIC_PREFIX=senior-pomidor-ci \
            --env HTTP_ENABLED=true \
            --env CORE_HTTP_URL=http://127.0.0.1:1/api/v1/edge/telemetry \
            --env HTTP_TIMEOUT_SECONDS=0.2 \
            --env TELEMETRY_SPOOL_PENDING_RETENTION_DAYS=14 \
            --env TELEMETRY_SPOOL_DELIVERED_RETENTION_DAYS=1 \
            --env TELEMETRY_SPOOL_MAX_PAYLOAD_BYTES=4096 \
            --env TELEMETRY_SPOOL_CAPACITY_MB=1266 \
            "$IMAGE_TAG"

      - name: Verify telemetry collection loop
        shell: bash
        run: |
          set -euo pipefail

          read_persisted_at() {
            docker exec "$CONTAINER_NAME" \
              python -c 'import json; print(json.load(open("/app/data/watchdog/heartbeat.json", encoding="utf-8")).get("last_persisted_at_utc") or "")' \
              2>/dev/null || true
          }

          deadline=$((SECONDS + 30))
          first_persisted_at=""
          while (( SECONDS < deadline )); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]]; then
              echo "Edge container exited before persisting telemetry" >&2
              exit 1
            fi
            first_persisted_at="$(read_persisted_at)"
            if [[ -n "$first_persisted_at" ]]; then
              break
            fi
            sleep 1
          done
          if [[ -z "$first_persisted_at" ]]; then
            echo "Timed out waiting for the first persisted telemetry sample" >&2
            exit 1
          fi

          sleep "$POLL_INTERVAL_SECONDS"

          deadline=$((SECONDS + 15))
          second_persisted_at=""
          while (( SECONDS < deadline )); do
            if [[ "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" != "true" ]]; then
              echo "Edge container exited after the first telemetry sample" >&2
              exit 1
            fi
            second_persisted_at="$(read_persisted_at)"
            if [[ -n "$second_persisted_at" && "$second_persisted_at" != "$first_persisted_at" ]]; then
              break
            fi
            sleep 1
          done
          if [[ -z "$second_persisted_at" || "$second_persisted_at" == "$first_persisted_at" ]]; then
            echo "Timed out waiting for the persisted telemetry timestamp to advance" >&2
            exit 1
          fi

          test "$(docker inspect --format '{{.State.Running}}' "$CONTAINER_NAME")" = "true"
          echo "Telemetry persisted twice: $first_persisted_at -> $second_persisted_at"

      - name: Show edge container logs
        if: failure()
        run: docker logs "$CONTAINER_NAME" 2>&1 || true

      - name: Remove edge container
        if: always()
        run: docker rm --force "$CONTAINER_NAME" 2>/dev/null || true

  python-quality:
    name: Python quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

      - name: Check formatting
        run: ruff format --check .

      - name: Run lint
        run: ruff check .

      - name: Run type checks
        run: mypy src

  dependency-security:
    name: Dependency security
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-hardware.txt
            requirements-dev.txt

      - name: Install audit tool
        run: python -m pip install -r requirements-dev.txt

      - name: Audit runtime dependencies
        run: pip-audit --cache-dir .cache/pip-audit -r requirements.txt

      - name: Audit hardware dependencies
        run: pip-audit --cache-dir .cache/pip-audit -r requirements-hardware.txt

  shell-docker-security:
    name: Shell, Docker, and secret hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends shellcheck

      - name: Check setup script
        run: shellcheck scripts/setup_raspberry_pi.sh

      - name: Check staging management script
        run: shellcheck deploy/rehearsal/edge-staging/manage.sh

      - name: Validate hardware Compose file
        run: docker compose config

      - name: Validate mock Compose file
        run: docker compose -f docker-compose.mock.yml config

      - name: Validate integration Compose file
        run: docker compose -f docker-compose.integration.yml config

      - name: Validate staging Compose file
        env:
          EDGE_IMAGE: ghcr.io/example/senior-pomidor-edge@sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          STAGING_MQTT_HOST: mqtt.staging.example.invalid
          STAGING_MQTT_PORT: "8883"
          STAGING_MQTT_USERNAME: staging-ci-user
          STAGING_MQTT_PASSWORD: staging-ci-password
          STAGING_MQTT_TLS: "true"
          STAGING_CORE_HTTP_URL: https://core.staging.example.invalid/api/v1/edge/telemetry
          STAGING_TELEMETRY_UPLOAD_TOKEN: staging-ci-token
        run: docker compose -f deploy/rehearsal/edge-staging/compose.yml config

      - name: Check Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      - name: Scan for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
